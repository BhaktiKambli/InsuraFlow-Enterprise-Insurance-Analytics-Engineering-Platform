version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: insuraflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insuraflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: insuraflow-airflow

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    volumes:
      - ./airflow:/opt/airflow
      - ./data:/opt/airflow/data
      
    command: standalone

volumes:
  postgres_data: